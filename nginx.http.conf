# http context (conf.d/)
server_tokens off;

# Real client IP as forwarded by Nginx Proxy Manager (it sets X-Real-IP)
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;

# SignalR WebSocket upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Hosts the admin may be reached under. A DNS-rebinding page arrives with the
# attacker's own hostname, so anything else is dropped. IP literals stay allowed
# for direct LAN access (http://192.168.1.200:28881).
map $host $admin_host_ok {
    default                              0;
    fileshare-admin.raphaelm22.net       1;
    localhost                            1;
    "~^[0-9]{1,3}(\.[0-9]{1,3}){3}$"     1;
    "~^\[?[0-9a-fA-F:]+\]?$"             1;
}

# Browser requests carrying an Origin (POST/DELETE, WebSocket upgrades) must come
# from this same site: Origin host:port must equal the Host header. Blocks
# cross-site pages from driving the API or opening the SignalR socket.
map "$http_origin#$http_host" $admin_origin_ok {
    default                              0;
    "~^#"                                1;
    "~^https?://(?<origin_hp>[^/]+)#\k<origin_hp>$" 1;
}
