server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Admin is LAN/VPN only ─────────────────────────────────────────────
    # Second layer behind NPM's access list: even if this host is ever reachable
    # from the internet (port forward, Host header trick), public IPs get 403.
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    allow fc00::/7;
    allow fe80::/10;
    allow ::1;
    deny all;

    # Host allowlist and same-origin check: see maps in nginx.http.conf
    if ($admin_host_ok = 0) {
        return 444;
    }

    resolver 127.0.0.11 valid=30s;
    set $backend "backend:8080";

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # ─── Backend API (same origin — no CORS needed) ────────────────────────
    location /api/ {
        if ($admin_origin_ok = 0) {
            return 403;
        }
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 64k;
    }

    # ─── SignalR hub (negotiate POST + WebSocket) ──────────────────────────
    location /hubs/ {
        if ($admin_origin_ok = 0) {
            return 403;
        }
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
